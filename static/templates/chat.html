{% extends "base.html" %}
{% block content %}

<div style="max-width:800px; margin:auto; padding:30px;">

  <h2>Chat with {{ other_user.username }}</h2>

  <div style="height:400px; overflow-y:scroll; border:1px solid #ddd; padding:10px; border-radius:10px;">

    {% for msg in messages %}

      {% if msg.sender_id == current_user.id %}
        <div style="text-align:right; margin:5px;">
          <span style="background:#d1e7dd; padding:8px 12px; border-radius:10px;">
            {{ msg.message }}
          </span>
        </div>
      {% else %}
        <div style="text-align:left; margin:5px;">
          <span style="background:#f8d7da; padding:8px 12px; border-radius:10px;">
            {{ msg.message }}
          </span>
        </div>
      {% endif %}

    {% endfor %}

  </div>

  <form method="POST" action="{{ url_for('send_message', receiver_id=other_user.id) }}"
        style="margin-top:10px; display:flex; gap:10px;">

    <input type="text" name="message" placeholder="Type message..."
           style="flex:1; padding:10px; border-radius:10px;">

    <button class="join-btn">Send</button>

  </form>

</div>

{% endblock %}
