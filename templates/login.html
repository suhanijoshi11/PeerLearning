{% extends "base.html" %}

{% block content %}
<section class="login-form">
  <form method="POST" action="">
    <h2>Welcome Back</h2>
    <p style="text-align: center; color: var(--text-secondary); margin-bottom: 25px;">Login to continue learning and sharing knowledge.</p>
    
    {{ form.hidden_tag() }}
    
    <div>
      {{ form.username(placeholder="Username") }}
    </div>
    
    <div>
      {{ form.password(placeholder="Password") }}
    </div>
    
    <div>
      {{ form.submit() }}
    </div>
    
    <p style="text-align: center; margin-top:20px; font-size: 14px;">
      Don't have an account? 
      <a href="{{ url_for('register') }}" style="color: var(--accent-dark); font-weight: 600;">Sign Up</a>
    </p>
  </form>
</section>
</body>
</html>
{% endblock %}
